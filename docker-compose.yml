services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      MKT_DATA_DIR: /data
      # مبدأهای مجاز CORS — آدرس عمومی فرانت را اینجا بگذارید
      MKT_CORS_ORIGINS: http://localhost:3000
    volumes:
      - ./data:/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # آدرس عمومی API از دید مرورگر کاربر (نه نام سرویس داخلی)
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped
