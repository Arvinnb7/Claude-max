name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: System libraries (WeasyPrint)
        run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b libcairo2
      - name: Install
        # همه‌ی افزونه‌ها نصب می‌شوند تا مسیرهای PDF و پیش‌بینی هم در CI اجرا شوند
        # (پیش‌تر فقط api,dev نصب می‌شد و آن تست‌ها بی‌صدا skip می‌شدند)
        run: pip install -e ".[api,dev,connectors,pdf,xls,forecast]"
      - name: Lint
        run: ruff check .
      - name: Tests
        # تست‌های PDF در نبود WeasyPrint سیستمی خودکار skip می‌شوند
        run: python -m pytest -q

  frontend:
    name: Frontend (eslint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npx eslint src --max-warnings 0
      - name: Build
        run: npm run build
